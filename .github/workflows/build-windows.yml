name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python mediapipe pyinstaller
          New-Item -ItemType Directory -Force outputs\models
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -OutFile "outputs\models\hand_landmarker.task"

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name VisionSketch --add-data "outputs\models\hand_landmarker.task;models" outputs\webcam_face_tracker.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionSketch-Windows
          path: dist/VisionSketch.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VisionSketch.exe
          generate_release_notes: true
